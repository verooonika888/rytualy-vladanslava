<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Помилка оплати | Влада - Жриця Гекати</title>
    
    <!-- Підключення шрифтів -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#050101',      
                        bgCard: '#0a0202',      
                        garnet: '#800020',      
                        garnetLight: '#a31535', 
                        textHighlight: '#c8102e', 
                        textMuted: '#a19697'    
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            color: #f4f4f5; 
            background-color: #050101; 
            background-image: url("data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
        }
        .btn-outline {
            border: 1px solid #a31535;
            color: #ffb3c6;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .btn-outline:hover {
            background-color: rgba(163, 21, 53, 0.2);
            box-shadow: 0 0 15px rgba(163, 21, 53, 0.3);
            color: #ffffff;
        }
    </style>
</head>
<body class="antialiased relative min-h-[100dvh] flex flex-col items-center justify-center p-4"> 

    <!-- ФОНОВЕ ФОТО ТА ЗАТЕМНЕННЯ -->
    <div class="fixed inset-0 w-full h-full bg-[url('bg.jpg')] bg-cover bg-center bg-no-repeat z-[-3] opacity-40 pointer-events-none"></div>
    <div class="fixed inset-0 w-full h-full bg-gradient-to-b from-[#050101]/30 via-[#0a0202]/60 to-[#050101]/80 z-[-2] pointer-events-none"></div>

    <!-- КАРТКА ПОМИЛКИ -->
    <div class="relative z-10 bg-[#0a0202] border border-gray-800 p-8 md:p-12 rounded-3xl w-full max-w-[450px] text-center shadow-[0_0_40px_rgba(163,21,53,0.15)]">
        
        <!-- Іконка хрестика -->
        <div class="mx-auto flex items-center justify-center w-20 h-20 bg-gray-900 rounded-full border border-gray-700 mb-6 shadow-lg">
            <svg class="w-10 h-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </div>

        <h1 class="text-3xl font-serif font-medium text-white mb-4 drop-shadow-md">Сталася помилка</h1>
        
        <p class="text-textMuted text-sm leading-relaxed mb-8 font-light">
            На жаль, транзакцію було відхилено банком, або сталася технічна помилка.<br><br>
            <strong class="text-white font-medium">Твої кошти не були списані.</strong><br> Будь ласка, перевір ліміти для оплати в інтернеті на картці або спробуй іншу.
        </p>

        <!-- Кнопка повернення на сторінку оплати WayForPay -->
        <button onclick="window.history.back()" class="block w-full btn-outline text-[11px] font-bold py-4 rounded-xl uppercase tracking-[0.2em] transition text-center">
            Повторити платіж
        </button>
    </div>

</body>
</html>
